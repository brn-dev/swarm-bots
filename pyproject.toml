[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-bots"
version = "0.1.0a1"
description = "A GPU-vectorized multi-agent benchmark for self-assembling modular robots."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Dominik Baron", email = "dominik.b4ron@gmail.com" },
]
keywords = [
    "benchmark",
    "multi-agent reinforcement learning",
    "mujoco",
    "robotics",
    "swarm robotics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.1",
    "loguru>=0.7",
    "moviepy>=2.1",
    "mujoco>=3.10",
    "mujoco-warp>=3.10.0.1",
    "numpy>=2.0",
    "pillow>=11",
    "torch>=2.4",
    "warp-lang>=1.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[project.scripts]
swarmbots = "swarmbots.benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/brn-dev/swarm-bots"
Documentation = "https://github.com/brn-dev/swarm-bots/tree/main/docs"
Issues = "https://github.com/brn-dev/swarm-bots/issues"
Repository = "https://github.com/brn-dev/swarm-bots.git"

[tool.setuptools.packages.find]
include = ["swarmbots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a complete MJWarp environment",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
exclude-newer = "1 week"
