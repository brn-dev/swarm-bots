[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-bots"
version = "0.1.0"
description = "Swarm robot simulation environments and reinforcement learning training code."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium",
    "loguru",
    "moviepy",
    "mujoco>=3.1",
    "numpy",
    "pandas",
    "pillow",
    "torch==2.10.0+cu128 ; sys_platform == 'win32'",
    "torch ; sys_platform != 'win32'",
]

[project.optional-dependencies]
mjw = ["mujoco-warp", "warp-lang"]
plot = ["matplotlib"]
prompt = ["prompt-toolkit"]
wandb = ["wandb"]
warp = ["mujoco-warp", "warp-lang"]

[dependency-groups]
dev = [
    "ipython",
    "pytest",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["swarmbots*"]
exclude = ["runs*", "runs_synced*", "videos*", "recording*", "plot_logs*", "scripts*"]
