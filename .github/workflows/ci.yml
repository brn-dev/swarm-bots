name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: .venv/bin/python -m ruff check swarmbots tests examples
      - run: .venv/bin/python -m pytest
      - run: uv build --no-sources
        if: matrix.python-version == '3.13'
      - name: Test installed wheel outside checkout
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import pathlib, sys, swarmbots; assert pathlib.Path(swarmbots.__file__).is_relative_to(pathlib.Path(sys.prefix))'
          "$GITHUB_WORKSPACE/.venv/bin/swarmbots" list --json
          "$GITHUB_WORKSPACE/.venv/bin/swarmbots" smoke SwarmBots-MoveTo-v0 --device cpu --num-envs 2 --steps 2
